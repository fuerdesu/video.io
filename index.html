<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fuerdesu | 个人作品集</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --surface-color: #1a1d24;
            --text-main: #e0e6ed;
            --text-muted: #8892b0;
            --accent-color: #ff61a6; /* 呼应虚拟小镇排版的粉色 */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            padding: 5rem 2rem 3rem;
        }

        .header h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 2px;
        }

        .header h1 span {
            color: var(--accent-color);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem 5rem;
        }

        .card {
            background: var(--surface-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 97, 166, 0.15);
        }

        .media-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 视频填满容器 */
        .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 图片完整展示不被裁剪 */
        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transition: transform 0.5s ease;
        }
        
        .card:hover .media-container img {
            transform: scale(1.05); /* 鼠标悬停时图片微微放大 */
        }

        .card-content {
            padding: 1.8rem;
        }

        .card-title {
            margin: 0 0 0.5rem;
            font-size: 1.3rem;
            color: #fff;
        }

        .card-desc {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .tags {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }

        .tag {
            background-color: rgba(255, 97, 166, 0.1);
            color: var(--accent-color);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <header class="header">
        <h1><span>fuerdesu</span> 的数字宇宙</h1>
        <p>AI 视觉设计 / 概念设定 / 互动排版</p>
    </header>

    <main class="portfolio-grid">
        
        <article class="card">
            <div class="media-container">
                <video controls autoplay muted loop playsinline>
                    <source src="https://github.com/fuerdesu/video.io/releases/download/untagged-bb2cc87b79303164cf45/2.14.1.mp4" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>
            <div class="card-content">
                <h2 class="card-title">Virtual Town: Pixel Paradise</h2>
                <p class="card-desc">虚拟小镇项目的交互排版与机制分析演示视频，展示了整体的视觉动线与UI布局设计。</p>
                <div class="tags">
                    <span class="tag">排版设计</span>
                    <span class="tag">UI / UX</span>
                    <span class="tag">动态演示</span>
                </div>
            </div>
        </article>

        <article class="card">
            <div class="media-container">
                <img src="https://raw.githubusercontent.com/fuerdesu/video.io/main/350585175.jpg" alt="视觉插画作品" loading="lazy">
            </div>
            <div class="card-content">
                <h2 class="card-title">概念视觉设定 (Concept Art)</h2>
                <p class="card-desc">探索神秘与奇幻风格的视觉插图，结合 AI 辅助生成的精美细节与色彩把控。</p>
                <div class="tags">
                    <span class="tag">概念设定</span>
                    <span class="tag">AI 绘画</span>
                    <span class="tag">场景插画</span>
                </div>
            </div>
        </article>

    </main>

    <footer>
        <p>&copy; 2026 fuerdesu. Hosted with GitHub Pages.</p>
    </footer>

</body>
</html>
